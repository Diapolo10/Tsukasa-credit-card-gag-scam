version: '3'

tasks:
  tools:
    desc: Install development tools
    sources:
      - mise.toml
      - mise.lock
      - .mise/locks
    cmds:
      - mise install --locked

  packages:
    desc: Install Python packages
    deps:
      - task: tools
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/**/*
    cmds:
      - mise exec -- uv sync --frozen

  hooks:
    desc: Install Git hooks
    sources:
      - .githooks/**/*
      - tasks/hook.yml
    status:
      - test "$(git config --get core.hooksPath)" = ".githooks"
    cmds:
      - git config core.hooksPath .githooks
