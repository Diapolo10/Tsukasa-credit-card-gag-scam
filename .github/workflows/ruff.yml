# This workflow runs the Ruff linter

name: Ruff

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*' # Avoid re-running existing commit on release

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Install library and dependencies
        run: task install

      - name: Lint with Ruff
        run: task lint
