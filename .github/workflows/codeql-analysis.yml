# This generic workflow analyses the repository with CodeQL

name: CodeQL analysis

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    uses: diapolo10/.github/.github/workflows/codeql.yml@22e09955b0bb3486f79cd26a5049f1c6a49cb5ae
    with:
      languages: '["actions", "python"]'
