# This generic workflow analyses the repository with CodeQL

name: CodeQL analysis

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 0 * * *'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    uses: diapolo10/.github/.github/workflows/analyse-codeql.yml@b4855cc4598784c83e4135e3cc2efa1ea2d325f7
    with:
      languages: '["actions", "python"]'
