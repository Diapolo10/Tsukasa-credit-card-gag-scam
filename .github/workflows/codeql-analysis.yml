# This generic workflow analyses the repository with CodeQL

name: CodeQL analysis

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    uses: diapolo10/.github/.github/workflows/codeql.yml@0d2a670ccb5c29efe1b551542e680ef8f7a02ba4
    with:
      languages: '["actions", "python"]'
