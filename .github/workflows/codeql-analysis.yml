# This generic workflow analyses the repository with CodeQL

name: CodeQL analysis

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    uses: diapolo10/.github/.github/workflows/codeql.yml@f04b6c25447e3e440e63e66e3e6a114f9076f075
    with:
      languages: '["actions", "python"]'
