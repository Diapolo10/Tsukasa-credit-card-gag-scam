# This generic workflow analyses the repository with CodeQL

name: CodeQL analysis

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    uses: diapolo10/.github/.github/workflows/codeql.yml@ca58b6e175aae9026e66905e4b4b55c0088fcafb
    with:
      languages: '["actions", "python"]'
