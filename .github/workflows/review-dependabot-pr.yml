# This workflow enables Dependabot to automatically rebase dependency updates

name: Review Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  review-dependabot-pr:
    uses: diapolo10/.github/.github/workflows/review-dependabot-pr.yml@b4855cc4598784c83e4135e3cc2efa1ea2d325f7
    permissions:
      contents: write
      pull-requests: write
      issues: write
