# Run linters using mise and Taskfile

name: Run linters

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*' # Avoid re-running existing commit on release

permissions:
  contents: read

jobs:
  lint:
    uses: diapolo10/.github/.github/workflows/lint.yml@b4855cc4598784c83e4135e3cc2efa1ea2d325f7
